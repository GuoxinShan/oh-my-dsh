# dsh-web-search-toggle: two rows — the Host gateway serving the toggle over
# the Typert Remote seam, and the browser settings row (General section) that
# reads/writes it. The toggle edits the home patch layer's managed block
# (`- id: tool-web / disabled: true`), which the harness watches live.
- insert:
    - id: dsh-web-search-toggle-gateway
      name: dsh-web-search-toggle/gateway
    - id: dsh-web-search-toggle
      name: dsh-web-search-toggle
