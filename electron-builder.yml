appId: dev.dsh.desktop
productName: Oh My DSH
copyright: MIT
asar: true
directories:
  output: release
  buildResources: src/build
files:
  - dist-electron/**/*
  - package.json
extraResources:
  - from: src/resources
    to: resources
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  icon: src/icons/icon.icns
  # DMG only. The updater zip is built afterwards from the signed .app
  # (runtime.tar.gz stripped) so we do not pack a fat zip and throw it away.
  target:
    - dmg
  artifactName: Oh-My-DSH-${version}-${arch}.${ext}
dmg:
  # 1x PNG; electron-builder 26 pairs it with background@2x.png in the same
  # directory and sizes the Finder window from the 1x pixel dimensions.
  background: src/dmg/background.png
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 196
      type: file
    - x: 480
      y: 196
      type: link
      path: /Applications
  artifactName: Oh-My-DSH-${version}-${arch}.${ext}
win:
  icon: src/icons/icon.ico
  target:
    - nsis
  artifactName: Oh-My-DSH-${version}-setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Oh My DSH
  installerIcon: src/icons/icon.ico
  uninstallerIcon: src/icons/icon.ico
publish:
  provider: github
  owner: aka-danielZhang
  repo: oh-my-dsh

