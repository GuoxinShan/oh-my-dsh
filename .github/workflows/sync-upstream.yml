name: Sync upstream

# Keep this fork's main in lockstep with aka-danielZhang/oh-my-dsh.
# Fast-forward / merge only — never --force. Already-up-to-date is success;
# a diverged main (merge conflict) fails the job instead of overwriting.

on:
  workflow_dispatch:
  schedule:
    # Weekdays every 2h 00:00–12:00 UTC = Hong Kong 08:00–20:00.
    - cron: '0 0,2,4,6,8,10,12 * * 1-5'

permissions:
  contents: write

jobs:
  sync:
    name: Sync main from aka-danielZhang/oh-my-dsh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output="$(gh repo sync "${{ github.repository }}" --branch main 2>&1)"
          status=$?
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # Some gh / API versions still exit non-zero when already current.
          if printf '%s' "$output" | grep -qiE 'already up[- ]to[- ]date'; then
            echo "Already up to date with upstream; treating as success."
            exit 0
          fi

          if printf '%s' "$output" | grep -qiE 'conflict|cannot be updated|not a fast.forward|diverged'; then
            echo "::error::Fork main has diverged from aka-danielZhang/oh-my-dsh and cannot be fast-forwarded or merged. This workflow never force-pushes. Resolve the conflict on main, then re-run."
            exit 1
          fi

          echo "::error::Failed to sync ${{ github.repository }} from upstream aka-danielZhang/oh-my-dsh."
          exit "$status"
