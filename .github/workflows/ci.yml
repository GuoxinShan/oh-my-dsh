name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Bridge plugin (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            plugin/dsh-desktop-bridge/pnpm-lock.yaml
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Build harness (lib/types the plugin typechecks against)
        working-directory: harness
        run: pnpm run build
      - name: Plugin setup + checks
        working-directory: plugin/dsh-desktop-bridge
        run: |
          pnpm install --no-frozen-lockfile
          DSH_CHECKOUT="$GITHUB_WORKSPACE/harness" pnpm run setup
          pnpm run typecheck
          pnpm run test
          pnpm run build

  shell:
    name: Tauri shell (cargo check)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
