name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: dsh-mcp-settings
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            dsh-mcp-settings/pnpm-lock.yaml
      - name: Install Harness dependencies
        run: pnpm install --frozen-lockfile
        working-directory: deepseek-harness
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dsh-mcp-settings
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: dsh-mcp-settings
      - name: Test
        run: pnpm test
        working-directory: dsh-mcp-settings
      - name: Build
        run: pnpm run bundle
        working-directory: dsh-mcp-settings
      - name: Smoke-check built JavaScript
        run: pnpm run smoke
        working-directory: dsh-mcp-settings
