name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Desktop-owned plugins (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Upstream-line discipline: typecheck against the SAME baseline the
      # runtime pins (runtime/revision.json spells v<base>+zw.N; the upstream
      # tag is dsh-<base>). A floating master checkout silently moves the
      # goalposts every time upstream publishes.
      - name: Resolve harness baseline from runtime/revision.json
        id: baseline
        run: |
          # Upstream tags keep the leading v (dsh-v0.1.0-rc.8); stripping it
          # here fabricated dsh-0.1.0-rc.8 and checkout failed on fetch.
          ref=$(node -p "JSON.parse(require('fs').readFileSync('runtime/revision.json','utf8')).ref")
          base="${ref%+zw.*}"
          case "$base" in
            v*.*) echo "tag=dsh-$base" >> "$GITHUB_OUTPUT" ;;
            *) echo "runtime/revision.json carries no baseline: $ref"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.baseline.outputs.tag }}
          path: harness
      # No `version` input: package.json packageManager (pnpm 10.28) is the
      # single source of truth — pinning a different major here made
      # action-setup hard-error on the conflict (red since rc.3).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            plugin/dsh-desktop-bridge/pnpm-lock.yaml
            plugin/dsh-compaction-hierarchical/pnpm-lock.yaml
            plugin/dsh-web-search-toggle/pnpm-lock.yaml
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Build harness (lib/types the plugin typechecks against)
        working-directory: harness
        run: pnpm run build
      - name: Bridge setup + checks
        working-directory: plugin/dsh-desktop-bridge
        run: |
          pnpm install --no-frozen-lockfile
          DSH_CHECKOUT="$GITHUB_WORKSPACE/harness" pnpm run setup
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - name: Hierarchical compaction checks
        working-directory: plugin/dsh-compaction-hierarchical
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - name: Web Search toggle checks
        working-directory: plugin/dsh-web-search-toggle
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run build

  shell:
    name: Tauri shell (prepare + cargo check)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tauri_build validates src-tauri/resources exist at cargo-check time;
      # they are gitignored and produced by desktop:prepare (desktop plugin
      # builds + runtime assembly + tarballs). Bare cargo check on a fresh checkout
      # always failed — prepare first, doubling as a runtime-assembly smoke.
      # (The Windows job below uses placeholder resources instead: a full
      # hoisted runtime assembly on windows runners is not worth the minutes
      # for a cargo test gate; the release job exercises the real assembly.)
      - name: Resolve harness baseline from runtime/revision.json
        id: baseline
        run: |
          # Upstream tags keep the leading v (dsh-v0.1.0-rc.8); stripping it
          # here fabricated dsh-0.1.0-rc.8 and checkout failed on fetch.
          ref=$(node -p "JSON.parse(require('fs').readFileSync('runtime/revision.json','utf8')).ref")
          base="${ref%+zw.*}"
          case "$base" in
            v*.*) echo "tag=dsh-$base" >> "$GITHUB_OUTPUT" ;;
            *) echo "runtime/revision.json carries no baseline: $ref"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.baseline.outputs.tag }}
          path: harness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            plugin/dsh-desktop-bridge/pnpm-lock.yaml
            plugin/dsh-compaction-hierarchical/pnpm-lock.yaml
            plugin/dsh-web-search-toggle/pnpm-lock.yaml
      # desktop:prepare checks every Desktop-owned plugin before assembling the
      # runtime, and the bridge's dsh anchor points here — the tree must carry
      # node_modules and built lib/types or every @deepseek-ai/* import fails
      # to resolve (the run red at 04:06 skipped these two steps).
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Build harness (lib/types the bridge typechecks against)
        working-directory: harness
        run: pnpm run build
      - name: Desktop plugin deps + bridge anchor
        run: |
          pnpm --dir plugin/dsh-desktop-bridge install --no-frozen-lockfile
          DSH_CHECKOUT="$GITHUB_WORKSPACE/harness" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-compaction-hierarchical install --frozen-lockfile
          pnpm --dir plugin/dsh-web-search-toggle install --frozen-lockfile
          pnpm --dir plugin/dsh-model-image-input install --frozen-lockfile
          pnpm --dir plugin/dsh-send-while-running install --frozen-lockfile
      - name: Prepare bundle resources
        run: pnpm run desktop:prepare
      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  shell-windows:
    name: Tauri shell Windows (cargo check + tests)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Placeholder bundle resources for cargo check
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          : > src-tauri/resources/runtime.tar.gz
          : > src-tauri/resources/bridge.tar.gz
          : > src-tauri/resources/compaction-hierarchical.tar.gz
          : > src-tauri/resources/web-search-toggle.tar.gz
          : > src-tauri/resources/model-image-input.tar.gz
          : > src-tauri/resources/send-while-running.tar.gz
          echo '{}' > src-tauri/resources/runtime-revision.json
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
