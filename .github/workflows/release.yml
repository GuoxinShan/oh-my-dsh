name: Release

# 增量发布流水线，tag 分流（见 AGENTS.md「发版」，无斜杠命名）：
#   v<semver>             → 桌面公证版（macOS .app/.dmg + Windows NSIS + electron-updater latest-mac.yml / latest.yml）
#   dsh-<name>-v<semver>  → 插件 Release（git archive 附件；allowlist 双通道插件
#                           另发 npm——dsh-mcp-settings / dsh-provider-balance，见
#                           plugin job 的 npm channel gate 与 AGENTS.md「发版」）
#
# ⚠️ latest 指针纪律：Electron 自动更新端点是 releases/latest/download/latest-mac.yml
# （mac）与 latest.yml（win）；desktop Release 独占 latest 指针；插件 Release
# 一律 make_latest: false，否则插件发布会把 latest 抢走、桌面自动更新即刻断链。
# ⚠️ 0.2.x Tauri 客户端不能经旧 latest.json 升到 0.3.x，必须手动下载新安装包。
# ⚠️ 双平台纪律：macos 与 windows 必须都成功才发 GitHub Release；一侧失败
# 则不发版，避免 updater yml 缺平台把该平台的自动更新打穿。

on:
  push:
    tags: ['v*', 'dsh-*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-rc.2 or dsh-provider-balance-v0.4.2)'
        required: true

permissions:
  contents: write

jobs:
  desktop-macos:
    name: Desktop macOS (sign, notarize)
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          [ "$HEAD_COMMIT" = "$TAG_COMMIT" ] || { echo "::error::checkout $HEAD_COMMIT != $TAG ($TAG_COMMIT)"; exit 1; }

      # Guard: the tag must carry exactly the version in the root package.json —
      # the classic "tag says X, code says Y" release mistake fails here.
      - name: Assert tag matches the desktop version
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          V=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG != v$V (package.json not bumped?)"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache runtime assembly (fork clone + tarball packs + installed tree)
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/signing.p12
          curl -s -A "Mozilla/5.0" -o /tmp/devg2ca.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/devg2ca.cer -k build.keychain
          rm -f /tmp/devg2ca.cer
          security find-identity -v -p codesigning build.keychain

      - name: Prepare desktop plugin deps and bridge type anchor
        run: |
          set -euo pipefail
          pnpm install
          # Prime the fork clone (prepare-runtime is idempotent; cache hits
          # make this seconds), then point the bridge's dsh symlink at it and
          # install every desktop-owned plugin's devDeps before bundle checks.
          node scripts/prepare-runtime.mjs
          DSH_CHECKOUT="$PWD/runtime/src" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-desktop-bridge install
          pnpm --dir plugin/dsh-compaction-hierarchical install --frozen-lockfile
          pnpm --dir plugin/dsh-web-search-toggle install --frozen-lockfile
          pnpm --dir plugin/dsh-model-image-input install --frozen-lockfile
          pnpm --dir plugin/dsh-send-while-running install --frozen-lockfile

      - name: Build signed + notarized bundle
        env:
          DSH_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm desktop:build -- --mac --config.mac.notarize=true

      - name: Verify DMG Finder layout
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmg-layout-venv"
          "$RUNNER_TEMP/dmg-layout-venv/bin/pip" install --quiet --disable-pip-version-check ds-store==1.3.1
          DMG=$(ls release/*.dmg | head -1)
          PATH="$RUNNER_TEMP/dmg-layout-venv/bin:$PATH" bash scripts/verify-dmg-layout.sh "$DMG"

      - name: Notarize, staple, and assess the DMG
        env:
          DSH_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls release/*.dmg | head -1)
          bash scripts/notarize-dmg.sh "$DMG"

      - name: Stage updater artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # electron-updater yml uses hyphenated names (Oh-My-DSH-…).
          # Never strip spaces to OhMyDSH — that 404s the updater.
          for f in release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml; do
            [ -e "$f" ] || continue
            cp "$f" "dist/$(basename "${f// /-}")"
          done
          [ -f dist/latest-mac.yml ] || { echo "::error::missing latest-mac.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: dist/

  desktop-windows:
    name: Desktop Windows (NSIS)
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          [ "$HEAD_COMMIT" = "$TAG_COMMIT" ] || { echo "::error::checkout $HEAD_COMMIT != $TAG ($TAG_COMMIT)"; exit 1; }

      - name: Assert tag matches the desktop version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          V=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG != v$V (package.json not bumped?)"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache runtime assembly (fork clone + tarball packs + installed tree)
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-

      - name: Prepare desktop plugin deps and bridge type anchor
        shell: bash
        run: |
          set -euo pipefail
          pnpm install
          node scripts/prepare-runtime.mjs
          DSH_CHECKOUT="$PWD/runtime/src" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-desktop-bridge install
          pnpm --dir plugin/dsh-compaction-hierarchical install --frozen-lockfile
          pnpm --dir plugin/dsh-web-search-toggle install --frozen-lockfile
          pnpm --dir plugin/dsh-model-image-input install --frozen-lockfile
          pnpm --dir plugin/dsh-send-while-running install --frozen-lockfile

      - name: Write Authenticode certificate for electron-builder
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE empty — NSIS will be unsigned (SmartScreen warning)"
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/windows-codesign.pfx"
          echo "CSC_LINK=$RUNNER_TEMP/windows-codesign.pfx" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build NSIS bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm desktop:build -- --win

      - name: Stage updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            [ -e "$f" ] || continue
            cp "$f" "dist/$(basename "${f// /-}")"
          done
          [ -f dist/latest.yml ] || { echo "::error::missing latest.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/

  desktop-publish:
    name: Desktop publish
    needs: [desktop-macos, desktop-windows]
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          [ "$HEAD_COMMIT" = "$TAG_COMMIT" ] || { echo "::error::checkout $HEAD_COMMIT != $TAG ($TAG_COMMIT)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: dist

      - name: Compose release notes
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          node scripts/release-notes.mjs "$VERSION" > dist/release-notes.md
          # 0.2.x still polls releases/latest/download/latest.json. Keep a
          # cutover document there so they see a newer version instead of 404.
          node scripts/tauri-cutover-latest-json.mjs "$VERSION" dist/latest.json

      - name: Publish GitHub Release (owns the latest pointer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: dist/release-notes.md
          prerelease: false
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.exe
            dist/latest-mac.yml
            dist/latest.yml
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Plugin (${{ github.ref_name }})
    if: startsWith(github.ref_name, 'dsh-') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'dsh-'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: git archive needs the tagged tree, and workflow_dispatch
      # runs check out a branch (shallow) where tags are absent otherwise.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          [ "$HEAD_COMMIT" = "$TAG_COMMIT" ] || { echo "::error::checkout $HEAD_COMMIT != $TAG ($TAG_COMMIT)"; exit 1; }

      # dsh-<name>-v<semver>: split at the last '-v' (dashes in package names survive).
      - name: Resolve plugin name and version from the tag
        id: plugin
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # dsh-<name>-v<semver>: split at the LAST "-v" so dashes inside
          # package names (dsh-mcp-settings) survive.
          NAME=${TAG%-v*}
          VERSION=${TAG##*-v}
          case "$NAME" in dsh-*|v) ;; *) echo "::error::tag $TAG does not look like dsh-<name>-v<semver>"; exit 1;; esac
          [ -d "plugin/$NAME" ] || { echo "plugin/$NAME not found"; exit 1; }
          # Guard: the tag must carry exactly the package's declared version.
          PKG_V=$(node -p "JSON.parse(require('fs').readFileSync('plugin/$NAME/package.json','utf8')).version")
          [ "v$PKG_V" = "v$VERSION" ] || { echo "::error::tag version $VERSION != package.json version $PKG_V for $NAME"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # npm dual channel (AGENTS.md 「发版」): only the allowlisted plugins
      # publish to the registry; every plugin still ships the git-archive
      # tarball below. The gate also records whether the package needs a
      # build step before packing (mcp-settings builds lib/ against the
      # harness sources).
      - name: npm channel gate
        id: npm
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          case " dsh-mcp-settings dsh-provider-balance " in
            *" $NAME "*) ON_NPM=true ;;
            *) ON_NPM=false ;;
          esac
          HAS_BUILD=$(node -p "!!(JSON.parse(require('fs').readFileSync('plugin/$NAME/package.json','utf8')).scripts||{}).build")
          {
            echo "on_npm=$ON_NPM"
            echo "has_build=$HAS_BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "npm channel: $ON_NPM (build needed: $HAS_BUILD)"

      - name: Resolve harness baseline from runtime/revision.json
        if: steps.npm.outputs.has_build == 'true'
        id: baseline
        run: |
          # Upstream tags keep the leading v (dsh-v0.1.0-rc.8); stripping it
          # here fabricated dsh-0.1.0-rc.8 and checkout failed on fetch.
          ref=$(node -p "JSON.parse(require('fs').readFileSync('runtime/revision.json','utf8')).ref")
          base="${ref%+zw.*}"
          case "$base" in
            v*.*) echo "tag=dsh-$base" >> "$GITHUB_OUTPUT" ;;
            *) echo "runtime/revision.json carries no baseline: $ref"; exit 1 ;;
          esac

      - name: Check out harness at the pinned baseline
        if: steps.npm.outputs.has_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.baseline.outputs.tag }}
          path: harness

      # packageManager comes from the PLUGIN's package.json when the npm
      # channel needs a build (mcp-settings locks pnpm 11; the repo root locks
      # 10.28 — the two must not be crossed or install corrupts the lockfile).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ steps.npm.outputs.has_build == 'true' && format('plugin/{0}/package.json', steps.plugin.outputs.name) || 'package.json' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            plugin/dsh-mcp-settings/pnpm-lock.yaml

      # mcp-settings typechecks through tsconfig references into the harness
      # tree, so the harness needs its node_modules and built lib/types first
      # (same shape as the CI plugin job).
      - name: Install harness (types the plugin typechecks against)
        if: steps.npm.outputs.has_build == 'true'
        run: pnpm --dir harness install --frozen-lockfile

      - name: Build harness
        if: steps.npm.outputs.has_build == 'true'
        run: pnpm --dir harness run build

      # devDeps resolve through the plugin/deepseek-harness anchor created by
      # setup-plugins.mjs (same shape as the CI plugin job).
      - name: Build the plugin (npm channel, when it has a build script)
        if: steps.npm.outputs.has_build == 'true'
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          DSH_CHECKOUT="$GITHUB_WORKSPACE/harness" node scripts/setup-plugins.mjs
          pnpm --dir "plugin/$NAME" install --no-frozen-lockfile
          pnpm --dir "plugin/$NAME" run build

      - name: Publish to npm (allowlisted plugins)
        if: steps.npm.outputs.on_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          VERSION=${{ steps.plugin.outputs.version }}
          # Idempotence: a re-run over a version already on the registry skips.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "npm: $NAME@$VERSION already published, skipping"
            exit 0
          fi
          # npm needs the registry binding in .npmrc to pick NODE_AUTH_TOKEN
          # up (the env var alone is not consulted for a bare npm publish).
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          cd "plugin/$NAME"
          npm publish --access public
          # No immediate verify: the registry index lags a few seconds behind
          # publish, and an instant `npm view` raced a 404 into a red job even
          # though the publish itself succeeded (dsh-mcp-settings 0.2.3 first
          # publish). npm publish already fails loud on real errors.

      - name: Compose release body
        run: |
          NAME=${{ steps.plugin.outputs.name }}
          VERSION=${{ steps.plugin.outputs.version }}
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          {
            echo "$NAME $VERSION"
            echo
            echo "安装："
            if [ "${{ steps.npm.outputs.on_npm }}" = "true" ]; then
              echo "- npm（dsh plugin 直接转发 pnpm，裸包名即可）：\`dsh plugin --profile web add $NAME\`"
            fi
            echo "- 从 monorepo tag：\`dsh plugin --profile web add https://github.com/${{ github.repository }}.git#plugin/$NAME:$TAG\`"
            echo "- 或下载下方 tarball 解包后 \`dsh plugin --profile web add <目录>\`。"
            echo
            echo "变更见包内 CHANGELOG / README。"
          } > /tmp/release-body.md

      - name: Package the plugin subtree and built artifacts
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          STAGE=$(mktemp -d)
          trap 'rm -rf "$STAGE"' EXIT
          mkdir -p dist
          # Start from the immutable tag snapshot, then overlay lib/ produced by
          # the build step. `git archive` alone cannot see ignored artifacts and
          # previously emitted unusable tarballs for source-only plugin trees.
          git archive --format=tar --prefix="$NAME/" "$TAG:plugin/$NAME" | tar -xf - -C "$STAGE"
          if [ "${{ steps.npm.outputs.has_build }}" = "true" ]; then
            [ -d "plugin/$NAME/lib" ] || { echo "::error::plugin/$NAME build produced no lib/"; exit 1; }
            rm -rf "$STAGE/$NAME/lib"
            cp -R "plugin/$NAME/lib" "$STAGE/$NAME/lib"
          fi
          tar -C "$STAGE" -czf "dist/$NAME-${{ steps.plugin.outputs.version }}.tar.gz" "$NAME"

      # 插件 Release 绝不抢 latest 指针（见文件头注释）。
      - name: Publish GitHub Release (never latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          make_latest: false
          body_path: /tmp/release-body.md
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
