name: Release

# 增量发布流水线，tag 分流（见 AGENTS.md「发版」，无斜杠命名）：
#   v<semver>             → 桌面公证版（macOS .app/.dmg + Windows NSIS + updater artifacts + latest.json）
#   dsh-<name>-v<semver>  → 插件源码 Release（git archive 附件，不发 npm）
#
# ⚠️ latest 指针纪律：自动更新端点是 releases/latest/download/latest.json，
# desktop Release 独占 latest 指针；插件 Release 一律 make_latest: false，
# 否则插件发布会把 latest 抢走、桌面自动更新即刻断链。
# ⚠️ 双平台纪律：macos 与 windows 必须都成功才发 GitHub Release；一侧失败
# 则不发版，避免 latest.json 缺平台把该平台的自动更新打穿。

on:
  push:
    tags: ['v*', 'dsh-*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-rc.2 or dsh-provider-balance-v0.4.2)'
        required: true

permissions:
  contents: write

jobs:
  desktop-macos:
    name: Desktop macOS (sign, notarize)
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Guard: the tag must carry exactly the version in tauri.conf.json —
      # the classic "tag says X, code says Y" release mistake fails here.
      - name: Assert tag matches the desktop version
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name || inputs.tag }}"
          V=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG != v$V (src-tauri/tauri.conf.json + Cargo.toml not bumped?)"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache runtime assembly (fork clone + tarball packs + installed tree)
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/signing.p12
          curl -s -A "Mozilla/5.0" -o /tmp/devg2ca.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/devg2ca.cer -k build.keychain
          rm -f /tmp/devg2ca.cer
          security find-identity -v -p codesigning build.keychain

      - name: Prepare deps and the bridge type anchor
        run: |
          set -euo pipefail
          pnpm install
          # Prime the fork clone (prepare-runtime is idempotent; cache hits
          # make this seconds), then point the bridge's dsh symlink at it so
          # plugin:check inside the bundle step typechecks against harness
          # sources, and install its devDeps.
          node scripts/prepare-runtime.mjs
          DSH_CHECKOUT="$PWD/runtime/src" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-desktop-bridge install

      - name: Build signed + notarized bundle
        env:
          DSH_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # The updater key was generated with an EMPTY password; a whitespace
        # secret value gets dropped by GitHub, and an empty-but-set var makes
        # tauri prompt/fail. Keep the var unset unless the secret carries a
        # real password.
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ] && [ "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" != " " ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          pnpm desktop:build

      - name: Notarize the DMG (tauri notarizes the .app only)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          spctl -a -vv -t install "$DMG"

      - name: Stage updater fragment
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/release/bundle/macos/dsh-desktop.app.tar.gz dist/
          cp src-tauri/target/release/bundle/macos/dsh-desktop.app.tar.gz.sig dist/
          SIG=$(cat src-tauri/target/release/bundle/macos/dsh-desktop.app.tar.gz.sig)
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name || inputs.tag }}"
          node -e '
          const [sig, url] = process.argv.slice(1)
          require("fs").writeFileSync("dist/latest-darwin.json", JSON.stringify({ "darwin-aarch64": { signature: sig, url } }, null, 2) + "\n")
          ' "$SIG" "https://github.com/$REPO/releases/download/$TAG/dsh-desktop.app.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: dist/

  desktop-windows:
    name: Desktop Windows (NSIS)
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches the desktop version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name || inputs.tag }}"
          V=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG != v$V (src-tauri/tauri.conf.json + Cargo.toml not bumped?)"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache runtime assembly (fork clone + tarball packs + installed tree)
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-

      - name: Prepare deps and the bridge type anchor
        shell: bash
        run: |
          set -euo pipefail
          pnpm install
          node scripts/prepare-runtime.mjs
          DSH_CHECKOUT="$PWD/runtime/src" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-desktop-bridge install

      - name: Import Authenticode certificate
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/windows-import-cert.ps1

      - name: Build NSIS bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ] && [ "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" != " " ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -f src-tauri/tauri.windows-sign.json ]; then
            pnpm desktop:build -- --config src-tauri/tauri.windows-sign.json
          else
            echo "dsh-desktop: WINDOWS_CERTIFICATE secret empty — NSIS will be unsigned (SmartScreen warning)"
            pnpm desktop:build
          fi

      - name: Stage updater fragment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" dist/
          cp "$EXE.sig" dist/
          SIG=$(tr -d '\r' < "$EXE.sig")
          BASENAME=$(basename "$EXE")
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name || inputs.tag }}"
          node -e '
          const [sig, url] = process.argv.slice(1)
          require("fs").writeFileSync("dist/latest-windows.json", JSON.stringify({ "windows-x86_64": { signature: sig, url } }, null, 2) + "\n")
          ' "$SIG" "https://github.com/$REPO/releases/download/$TAG/$BASENAME"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/

  desktop-publish:
    name: Desktop publish
    needs: [desktop-macos, desktop-windows]
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: dist

      - name: Compose updater manifest (latest.json)
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          node scripts/compose-latest-json.mjs "$VERSION" dist/latest.json dist/latest-darwin.json dist/latest-windows.json

      - name: Publish GitHub Release (owns the latest pointer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/dsh-desktop.app.tar.gz
            dist/dsh-desktop.app.tar.gz.sig
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Plugin (${{ github.ref_name }})
    if: startsWith(github.ref_name, 'dsh-') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'dsh-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: git archive needs the tagged tree, and workflow_dispatch
      # runs check out a branch (shallow) where tags are absent otherwise.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dsh-<name>-v<semver>: split at the last '-v' (dashes in package names survive).
      - name: Resolve plugin name and version from the tag
        id: plugin
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name || inputs.tag }}"
          # dsh-<name>-v<semver>: split at the LAST "-v" so dashes inside
          # package names (dsh-mcp-settings) survive.
          NAME=${TAG%-v*}
          VERSION=${TAG##*-v}
          case "$NAME" in dsh-*|v) ;; *) echo "::error::tag $TAG does not look like dsh-<name>-v<semver>"; exit 1;; esac
          [ -d "plugin/$NAME" ] || { echo "plugin/$NAME not found"; exit 1; }
          # Guard: the tag must carry exactly the package's declared version.
          PKG_V=$(node -p "JSON.parse(require('fs').readFileSync('plugin/$NAME/package.json','utf8')).version")
          [ "v$PKG_V" = "v$VERSION" ] || { echo "::error::tag version $VERSION != package.json version $PKG_V for $NAME"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package the plugin subtree (git archive)
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          TAG="${{ github.ref_name || inputs.tag }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME-${{ steps.plugin.outputs.version }}.tar.gz" "$TAG:plugin/$NAME"

      # 插件 Release 绝不抢 latest 指针（见文件头注释）。
      - name: Publish GitHub Release (never latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          make_latest: false
          body: |
            ${{ steps.plugin.outputs.name }} ${{ steps.plugin.outputs.version }}

            安装（从 monorepo tag）：
            ```
            dsh plugin --profile web add https://github.com/${{ github.repository }}.git#plugin/${{ steps.plugin.outputs.name }}:${{ github.ref_name || inputs.tag }}
            ```
            或下载下方 tarball 解包后 `dsh plugin --profile web add <目录>`。
            变更见包内 CHANGELOG / README。
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
