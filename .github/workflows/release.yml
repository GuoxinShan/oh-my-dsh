name: Release

# 增量发布流水线，tag 前缀分家（见 AGENTS.md「发版」）：
#   desktop/vX.Y.Z        → 桌面公证版（.app/.dmg + updater artifacts + latest.json）
#   plugin/<name>/vX.Y.Z  → 插件源码 Release（git archive 附件，不发 npm）
#
# ⚠️ latest 指针纪律：自动更新端点是 releases/latest/download/latest.json，
# desktop Release 独占 latest 指针；插件 Release 一律 make_latest: false，
# 否则插件发布会把 latest 抢走、桌面自动更新即刻断链。

on:
  push:
    tags: ['desktop/v*', 'plugin/*/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop/v0.1.2 or plugin/dsh-provider-balance/v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (sign, notarize, publish)
    if: startsWith(github.ref_name, 'desktop/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'desktop/v'))
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache runtime assembly (fork clone + tarball packs + installed tree)
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/signing.p12
          curl -s -A "Mozilla/5.0" -o /tmp/devg2ca.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/devg2ca.cer -k build.keychain
          rm -f /tmp/devg2ca.cer
          security find-identity -v -p codesigning build.keychain

      - name: Prepare deps and the bridge type anchor
        run: |
          set -euo pipefail
          pnpm install
          # Prime the fork clone (prepare-runtime is idempotent; cache hits
          # make this seconds), then point the bridge's dsh symlink at it so
          # plugin:check inside the bundle step typechecks against harness
          # sources, and install its devDeps.
          node scripts/prepare-runtime.mjs
          DSH_CHECKOUT="$PWD/runtime/src" pnpm --dir plugin/dsh-desktop-bridge run setup
          pnpm --dir plugin/dsh-desktop-bridge install

      - name: Build signed + notarized bundle
        env:
          DSH_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:build

      - name: Notarize the DMG (tauri notarizes the .app only)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          spctl -a -vv -t install "$DMG"

      - name: Compose updater manifest (latest.json)
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          SIG=$(cat "$BUNDLE/macos/dsh-desktop.app.tar.gz.sig")
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name || inputs.tag }}"
          node -e '
          const [version, sig, url] = [process.argv[1], process.argv[2], process.argv[3]]
          const manifest = {
            version,
            notes: "See the release page for notes.",
            pub_date: new Date().toISOString(),
            platforms: { "darwin-aarch64": { signature: sig, url } },
          }
          require("fs").writeFileSync("src-tauri/target/release/bundle/latest.json", JSON.stringify(manifest, null, 2) + "\n")
          ' "$VERSION" "$SIG" "https://github.com/$REPO/releases/download/$TAG/dsh-desktop.app.tar.gz"

      - name: Publish GitHub Release (owns the latest pointer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          make_latest: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/dsh-desktop.app.tar.gz
            src-tauri/target/release/bundle/macos/dsh-desktop.app.tar.gz.sig
            src-tauri/target/release/bundle/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: Plugin (${{ github.ref_name }})
    if: startsWith(github.ref_name, 'plugin/') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'plugin/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: git archive needs the tagged tree, and workflow_dispatch
      # runs check out a branch (shallow) where tags are absent otherwise.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # plugin/<name>/vX.Y.Z → name + version; fail loud on a malformed tag.
      - name: Resolve plugin name and version from the tag
        id: plugin
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name || inputs.tag }}"
          NAME=$(printf '%s' "$TAG" | sed -E 's|^plugin/([^/]+)/v.*$|\1|')
          VERSION=$(printf '%s' "$TAG" | sed -E 's|^plugin/[^/]+/v(.*)$|\1|')
          [ -d "plugin/$NAME" ] || { echo "plugin/$NAME not found"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package the plugin subtree (git archive)
        run: |
          set -euo pipefail
          NAME=${{ steps.plugin.outputs.name }}
          TAG="${{ github.ref_name || inputs.tag }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME-${{ steps.plugin.outputs.version }}.tar.gz" "$TAG:plugin/$NAME"

      # 插件 Release 绝不抢 latest 指针（见文件头注释）。
      - name: Publish GitHub Release (never latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          make_latest: false
          body: |
            ${{ steps.plugin.outputs.name }} ${{ steps.plugin.outputs.version }}

            安装（从 monorepo tag）：
            ```
            dsh plugin --profile web add https://github.com/${{ github.repository }}.git#plugin/${{ steps.plugin.outputs.name }}:${{ github.ref_name || inputs.tag }}
            ```
            或下载下方 tarball 解包后 `dsh plugin --profile web add <目录>`。
            变更见包内 CHANGELOG / README。
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
