[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Desktop shell for the DeepSeek Harness web UI"
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.dev]
incremental = true
